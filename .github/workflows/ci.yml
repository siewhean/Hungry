name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Asset audit
        run: npm run audit:assets

      - name: Test
        run: npm run test

      - name: Scaling readiness static contracts
        run: node --import tsx --test src/app/scaling-readiness-contracts.test.ts

      - name: Scaling readiness scaffold validation
        run: npm run scaling:validate

      - name: Website SEO static validation
        run: |
          if [ -f marketing/website/web-v2/package.json ] && [ -f marketing/website/web-v2/package-lock.json ]; then
            npm ci --prefix marketing/website/web-v2
            npm --prefix marketing/website/web-v2 run predeploy:local
          else
            echo "web-v2 package files missing; skipping website static validation."
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Merchant catalog E2E smoke
        run: npm run test:e2e:merchant-catalog

      - name: Supabase static audit
        run: npm run audit:supabase:static

      - name: Migration safety (down file and staging rehearsal for every new migration)
        run: |
          npm run test:migration-safety
          npm run audit:supabase:migration-safety

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_DB_PASSWORD}" ] || [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "Supabase credentials or project ref not provided; skipping link."
            exit 0
          fi
          npx supabase link --project-ref "${SUPABASE_PROJECT_REF}" -p "${SUPABASE_DB_PASSWORD}"

      - name: Supabase Security Advisor guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_NPX_ALLOW_INSTALL: "1"
        run: npm run audit:supabase:advisor-security

      - name: Edge Function static check
        run: npm run check:edge-functions

      - name: Supabase migration dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_DB_PASSWORD}" ] || [ -z "${SUPABASE_PROJECT_REF}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "Supabase credentials missing on main; failing closed."
              exit 1
            fi
            echo "Supabase credentials not provided for non-main validation; skipping migration dry run."
            exit 0
          fi
          npx supabase db push --dry-run -p "${SUPABASE_DB_PASSWORD}"

      - name: Expo Doctor
        run: npx expo-doctor

  merge-compatibility:
    # Branch protection requires this check. It typechecks GitHub's synthetic
    # PR merge commit without any credentials.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub PR merge commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck merge commit
        run: npm run typecheck

  eas-build-gate:
    needs: quality-gates
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Until the repo has an EXPO_TOKEN secret, skip this gate with a visible notice so a
      # red main reflects quality-gates, not a missing secret. With the secret set, the
      # gate runs and any EAS failure still fails the job.
      - name: Check EAS credentials
        id: eas-credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::notice title=EAS build gate skipped::EXPO_TOKEN secret is not set; skipping EAS build gate. Add the EXPO_TOKEN repository secret to enable it."
            echo "EXPO_TOKEN missing on main; skipping EAS build gate." >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.eas-credentials.outputs.available == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        if: steps.eas-credentials.outputs.available == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        if: steps.eas-credentials.outputs.available == 'true'
        run: npm ci

      - name: Validate Expo account access
        if: steps.eas-credentials.outputs.available == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@18.12.3 whoami --non-interactive

      - name: Trigger EAS build gates
        if: steps.eas-credentials.outputs.available == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: npx --yes eas-cli@18.12.3 build --platform all --profile preview --non-interactive --no-wait
