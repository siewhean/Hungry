name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Final-candidate evidence is bound to the PR implementation commit.
          # Main pushes continue to test the pushed commit.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Asset audit
        run: npm run audit:assets

      - name: Release 0.1 pilot catalog gate
        run: node scripts/audit-release-01-catalog.mjs

      - name: Test
        run: npm run test

      - name: Scaling readiness static contracts
        run: node --import tsx --test src/app/scaling-readiness-contracts.test.ts

      - name: Scaling readiness scaffold validation
        run: npm run scaling:validate

      - name: Website SEO static validation
        run: |
          if [ -f marketing/website/web-v2/package.json ] && [ -f marketing/website/web-v2/package-lock.json ]; then
            npm ci --prefix marketing/website/web-v2
            npm --prefix marketing/website/web-v2 run predeploy:local
          else
            echo "web-v2 package files missing; skipping website static validation."
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Merchant catalog E2E smoke
        run: npm run test:e2e:merchant-catalog

      - name: Supabase static audit
        run: npm run audit:supabase:static

      - name: Supabase Security Advisor guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_NPX_ALLOW_INSTALL: "1"
        run: npm run audit:supabase:advisor-security

      - name: Edge Function static check
        run: npm run check:edge-functions

      - name: Supabase migration dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          HUNGRY_RELEASE_CANDIDATE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            if [ "${HUNGRY_RELEASE_CANDIDATE}" = "true" ]; then
              echo "Supabase credentials missing for a final-candidate PR or main push; configure repository Actions secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD. Failing closed."
              exit 1
            fi
            echo "Supabase credentials not provided for non-main validation; skipping migration dry run."
            exit 0
          fi
          npx supabase db push --dry-run -p "${SUPABASE_DB_PASSWORD}"

      - name: Expo Doctor
        run: npx expo-doctor

  merge-compatibility:
    # Keep the final-candidate evidence bound to head.sha while independently
    # checking that GitHub's synthetic PR merge commit still typechecks.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub PR merge commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck merge commit
        run: npm run typecheck

  eas-build-gate:
    needs: [quality-gates, merge-compatibility]
    runs-on: ubuntu-latest
    # Trusted, same-repository PRs are release candidates. Fork PRs never receive
    # release secrets and therefore cannot run the EAS gate.
    if: >-
      always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      )

    steps:
      - name: Require successful quality gates
        if: needs.quality-gates.result != 'success'
        run: |
          echo "Quality gates completed with '${{ needs.quality-gates.result }}'. The EAS build was not started; resolve and rerun the final-candidate workflow."
          exit 1

      - name: Require merge compatibility for pull requests
        if: github.event_name == 'pull_request' && needs.merge-compatibility.result != 'success'
        run: |
          echo "Merge compatibility completed with '${{ needs.merge-compatibility.result }}'. The EAS build was not started; resolve the PR merge result and rerun the final-candidate workflow."
          exit 1

      - name: Validate final-candidate release credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=""
          for name in EXPO_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "Missing required release credentials for a final-candidate PR or main push:${missing}. Configure the corresponding repository Actions secrets, then rerun this workflow. Failing closed."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # EAS artifacts must identify the PR implementation commit, never the
          # transient GitHub pull-request merge commit.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo account access
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "EXPO_TOKEN missing for a final-candidate PR or main push; configure the repository Actions secret. Failing closed."
            exit 1
          fi
          npx --yes eas-cli@18.12.3 whoami --non-interactive

      - name: Trigger EAS build gates
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "EXPO_TOKEN missing for a final-candidate PR or main push; configure the repository Actions secret. Failing closed."
            exit 1
          fi
          npx --yes eas-cli@18.12.3 build --platform all --profile internal-alpha --non-interactive --no-wait
