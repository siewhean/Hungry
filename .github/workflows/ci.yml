name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# This workflow is deliberately secretless.  It only runs deterministic local
# and mock-backed checks, so pull requests never receive release credentials or
# dispatch EAS/Supabase work.  Reviewer-approved live release work is isolated
# in release-candidate.yml.
jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Asset audit
        run: npm run audit:assets

      - name: Release 0.1 pilot catalog gate
        run: node scripts/audit-release-01-catalog.mjs

      - name: Test
        run: npm run test

      - name: Scaling readiness static contracts
        run: node --import tsx --test src/app/scaling-readiness-contracts.test.ts

      - name: Scaling readiness scaffold validation
        run: npm run scaling:validate

      - name: Website SEO static validation
        run: |
          if [ -f marketing/website/web-v2/package.json ] && [ -f marketing/website/web-v2/package-lock.json ]; then
            npm ci --prefix marketing/website/web-v2
            npm --prefix marketing/website/web-v2 run predeploy:local
          else
            echo "web-v2 package files missing; skipping website static validation."
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Mock/local Playwright suite
        run: npm run test:e2e

      - name: Merchant catalog E2E smoke
        run: npm run test:e2e:merchant-catalog

      - name: Supabase static audit
        run: npm run audit:supabase:static

      - name: Migration safety (down file and staging rehearsal for every new migration)
        run: |
          npm run test:migration-safety
          npm run audit:supabase:migration-safety

      - name: Edge Function static check
        run: npm run check:edge-functions

      - name: Rate-limit contract
        run: npm run check:rate-limits

      - name: Expo Doctor
        run: npx expo-doctor

  merge-compatibility:
    # Branch protection requires this check. The ordinary PR checkout validates the
    # implementation SHA; this job typechecks GitHub's synthetic PR merge commit
    # without any credentials.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub PR merge commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck merge commit
        run: npm run typecheck
