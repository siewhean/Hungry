name: Release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable 40-character same-repository candidate commit SHA.
        required: true
        type: string
      pull_request_number:
        description: Optional same-repository PR number. Required for unmerged candidates.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

# This workflow is the only place release secrets may be used. It is manually
# dispatched from the default branch, validates the selected immutable SHA
# before the protected-environment job starts, and never executes untrusted PR
# code with release secrets.
jobs:
  validate-candidate:
    # workflow_dispatch may target any ref in the UI. Only the trusted default
    # branch definition may advance a candidate toward the secret-bearing job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}

    steps:
      - name: Checkout trusted workflow definition
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate immutable candidate ancestry
        id: candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${CANDIDATE_SHA}" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "candidate_sha must be a full lowercase 40-character SHA" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin main "${CANDIDATE_SHA}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor origin/main "${CANDIDATE_SHA}" || {
            echo "candidate_sha must descend from origin/main" >&2
            exit 1
          }

          if [ -n "${PULL_REQUEST_NUMBER}" ]; then
            case "${PULL_REQUEST_NUMBER}" in
              *[!0-9]*|'') echo "pull_request_number must be numeric" >&2; exit 1 ;;
            esac
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" \
              | node -e '
                let body = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { body += chunk; });
                process.stdin.on("end", () => {
                  const pull = JSON.parse(body);
                  const expected = process.env.CANDIDATE_SHA;
                  const valid = pull.state === "open" && pull.base?.ref === "main" &&
                    pull.head?.sha === expected && pull.head?.repo?.full_name === process.env.GITHUB_REPOSITORY;
                  if (!valid) {
                    console.error("candidate SHA must be the current head of an open same-repository PR targeting main");
                    process.exit(1);
                  }
                });
              '
          else
            git merge-base --is-ancestor "${CANDIDATE_SHA}" origin/main || {
              echo "an unmerged candidate requires pull_request_number" >&2
              exit 1
            }
          fi
          echo "candidate_sha=${CANDIDATE_SHA}" >> "${GITHUB_OUTPUT}"

  release-gates:
    needs: validate-candidate
    runs-on: ubuntu-latest
    # Configure this GitHub Environment with required reviewers and the release
    # secrets named below. Secrets are not available until approval.
    environment: release-candidate

    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.validate-candidate.outputs.candidate_sha }}

      - name: Verify selected checkout
        env:
          CANDIDATE_SHA: ${{ needs.validate-candidate.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require release secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          HUNGRY_SUPABASE_SMOKE_URL: ${{ secrets.HUNGRY_SUPABASE_SMOKE_URL }}
          HUNGRY_SUPABASE_SMOKE_ANON_KEY: ${{ secrets.HUNGRY_SUPABASE_SMOKE_ANON_KEY }}
          PLAYWRIGHT_STAGING_BASE_URL: ${{ secrets.PLAYWRIGHT_STAGING_BASE_URL }}
          PLAYWRIGHT_STAGING_EMAIL: ${{ secrets.PLAYWRIGHT_STAGING_EMAIL }}
          PLAYWRIGHT_STAGING_PASSWORD: ${{ secrets.PLAYWRIGHT_STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          for name in EXPO_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD HUNGRY_SUPABASE_SMOKE_URL HUNGRY_SUPABASE_SMOKE_ANON_KEY PLAYWRIGHT_STAGING_BASE_URL PLAYWRIGHT_STAGING_EMAIL PLAYWRIGHT_STAGING_PASSWORD; do
            test -n "${!name}" || { echo "Required release-candidate secret ${name} is unavailable." >&2; exit 1; }
          done

      - name: Supabase migration dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --dry-run -p "${SUPABASE_DB_PASSWORD}"

      - name: Supabase Security Advisor
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HUNGRY_SUPABASE_ADVISOR_REQUIRED: "1"
          HUNGRY_SUPABASE_ADVISOR_FAIL_ON_EXTERNAL: "1"
          SUPABASE_NPX_ALLOW_INSTALL: "1"
        run: npm run audit:supabase:advisor-security

      - name: Required Supabase catalog smokes
        env:
          HUNGRY_SUPABASE_SMOKE_REQUIRED: "1"
          HUNGRY_SUPABASE_SMOKE_URL: ${{ secrets.HUNGRY_SUPABASE_SMOKE_URL }}
          HUNGRY_SUPABASE_SMOKE_ANON_KEY: ${{ secrets.HUNGRY_SUPABASE_SMOKE_ANON_KEY }}
          HUNGRY_SUPABASE_SMOKE_PROJECT_REF: ${{ secrets.HUNGRY_SUPABASE_SMOKE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_NPX_ALLOW_INSTALL: "1"
        run: |
          npm run smoke:database:location
          npm run smoke:database:search
          npm run smoke:database:rls
          npm run smoke:database:catalog-raw

      - name: Credentialed staging fallback and no-results Playwright
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_STAGING_BASE_URL }}
          PLAYWRIGHT_STAGING_EMAIL: ${{ secrets.PLAYWRIGHT_STAGING_EMAIL }}
          PLAYWRIGHT_STAGING_PASSWORD: ${{ secrets.PLAYWRIGHT_STAGING_PASSWORD }}
        run: npx playwright test tests/e2e/authenticated-excel-fallback.spec.ts --project=chromium

      - name: Build internal-alpha artifacts from selected SHA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@21.1.0 whoami --non-interactive
          npx --yes eas-cli@21.1.0 build --platform all --profile internal-alpha --environment preview --non-interactive --no-wait --json | tee eas-builds.json
          printf 'candidate_sha=%s\n\n' "${{ needs.validate-candidate.outputs.candidate_sha }}" >> "${GITHUB_STEP_SUMMARY}"
          printf 'EAS build dispatch output is attached as release-candidate-eas-builds.\n' >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload EAS build dispatch evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-eas-builds
          path: eas-builds.json
          if-no-files-found: error
