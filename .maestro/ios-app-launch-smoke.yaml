appId: ${APP_ID}
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: "http://.*:8081"
    commands:
      - tapOn:
          text: "http://.*:8081"
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
      - tapOn: "Enter URL manually"
      - tapOn:
          point: "50%,34%"
      - inputText: "${METRO_URL}"
      - tapOn: "Connect"
- extendedWaitUntil:
    visible: "Hungry"
    timeout: 90000
- assertVisible:
    text: "Hungry"
