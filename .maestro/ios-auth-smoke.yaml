appId: ${APP_ID}
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "http://.*:8081"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: "Developer Launcher"
    commands:
      - tapOn:
          id: "dev-section-toggle-session-presets"
          optional: true
      - tapOn:
          id: "dev-button-signed-out"
          optional: true
      - tapOn:
          text: "Open normal app flow"
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      visible: "Open normal app flow"
    commands:
      - tapOn:
          text: "Open normal app flow"
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - assertVisible: "Welcome back"
      - assertVisible:
          text: "Email"
          optional: true
- runFlow:
    when:
      visible: "Home"
    commands:
      - assertVisible: "Home"
- runFlow:
    when:
      visible: "Open normal app flow"
    commands:
      - tapOn:
          text: "Open normal app flow"
          optional: true
      - waitForAnimationToEnd:
          timeout: 8000
