appId: ${APP_ID}
---
# Prerequisite: run with an authenticated staging account and make the catalog
# RPCs and get_discovery_feed_by_location unavailable (network proxy, RPC fault
# injection, or staging rule). Supabase builds show the redesigned Home, which
# hands off to the offline (Excel) Home only when its discovery feed fails.
# Authentication must remain valid throughout this flow.
- launchApp
- tapOn:
    text: "Hungry, http://.*:8081"
    optional: true
- tapOn:
    text: "Hungry"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
      - tapOn: "Enter URL manually"
      - tapOn:
          point: "50%,34%"
      - inputText: "${METRO_URL}"
      - tapOn: "Connect"
- runFlow:
    when:
      visible: "Sign in to Hungry"
    commands:
      - tapOn: "Use a password instead"
      - tapOn: "Email address"
      - inputText: "${STAGING_EMAIL}"
      - tapOn: "Password"
      - inputText: "${STAGING_PASSWORD}"
      - tapOn:
          text: "Sign in"
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- tapOn:
    text: "Home"
- extendedWaitUntil:
    visible:
      id: "catalog-source-excel"
    timeout: 60000
- assertVisible:
    id: "catalog-source-excel"
- assertVisible: "Offline catalog"
- assertVisible: "Nearby dishes"
# "Stalls near you" needs a GPS fix or a picked area; a fresh install has neither (regex).
- assertVisible: "Stalls( near you)?"
- assertVisible: "Browse the full directory"
- takeScreenshot: "ios-authenticated-excel-fallback"
