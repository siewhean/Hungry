appId: ${APP_ID}
---
# Prerequisite: run with an authenticated staging account and make the catalog
# RPCs and get_discovery_feed_by_location unavailable (network proxy, RPC fault
# injection, or staging rule). Supabase builds show the redesigned Home, which
# hands off to the offline Home page only when its discovery feed fails.
# Authentication must remain valid throughout this flow.
- launchApp
- tapOn:
    text: "Hungry, http://.*:8081"
    optional: true
- tapOn:
    text: "Hungry"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
      - tapOn: "Enter URL manually"
      - tapOn:
          point: "50%,34%"
      - inputText: "${METRO_URL}"
      - tapOn: "Connect"
- runFlow:
    when:
      visible: "Sign in to Hungry"
    commands:
      - tapOn: "Use a password instead"
      - tapOn: "Email address"
      - inputText: "${STAGING_EMAIL}"
      - tapOn: "Password"
      - inputText: "${STAGING_PASSWORD}"
      - tapOn:
          text: "Sign in"
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- tapOn:
    text: "Home"
- extendedWaitUntil:
    visible:
      id: "home-offline-root"
    timeout: 60000
- assertVisible: "Can't reach Hungry|You're offline"
- assertVisible: "Try again"
- takeScreenshot: "ios-authenticated-offline-home"
