appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn:
    point: "50%,22%"
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "http://.*:8081"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
      - tapOn: "Enter URL manually"
      - tapOn:
          point: "50%,34%"
      - inputText: "${METRO_URL}"
      - tapOn: "Connect"
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- runFlow:
    when:
      visible: "Developer Launcher"
    commands:
      - extendedWaitUntil:
          visible: "Developer Launcher"
          timeout: 60000
      - tapOn:
          id: "dev-button-activity"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: "activity-tab-messages"
    commands:
      - assertVisible:
          id: "activity-tab-messages"
      - assertVisible:
          id: "activity-tab-updates"
- runFlow:
    when:
      visible: "Home"
    commands:
      - assertVisible:
          text: "Home"
