appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn:
    text: "Hungry, http://.*:8081"
    optional: true
- tapOn:
    text: "Hungry"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible: "Developer Launcher"
    timeout: 60000
- tapOn:
    id: "dev-button-developer"
- tapOn: "Open normal app flow"
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "home-activity-inbox-button"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "home-activity-inbox-button"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    id: "home-activity-inbox-button"
    optional: true
- extendedWaitUntil:
    visible:
      id: "activity-tab-updates"
    timeout: 30000
- assertNotVisible:
    id: "activity-tab-messages"
- assertVisible: "Updates"
