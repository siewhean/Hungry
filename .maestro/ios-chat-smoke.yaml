appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn:
    text: "Hungry, http://.*:8081"
    optional: true
- tapOn:
    text: "Hungry"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
      - tapOn: "Enter URL manually"
      - tapOn:
          point: "50%,34%"
      - inputText: "${METRO_URL}"
      - tapOn: "Connect"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 60000
- tapOn: "Continue"
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible: "Developer Launcher"
    timeout: 60000
- tapOn:
    id: "dev-button-activity"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "activity-tab-messages"
    timeout: 30000
- assertVisible:
    id: "activity-tab-messages"
- assertVisible:
    id: "activity-tab-updates"
