appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn:
    text: "Hungry, http://.*:8081"
    optional: true
- tapOn:
    text: "Hungry"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
      - tapOn: "Enter URL manually"
      - tapOn:
          point: "50%,34%"
      - inputText: "${METRO_URL}"
      - tapOn: "Connect"
- extendedWaitUntil:
    visible: "Developer Launcher"
    timeout: 60000
- tapOn:
    id: "dev-button-user"
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
- assertVisible: "Home"
- tapOn:
    text: "Discover"
    optional: true
- assertVisible:
    text: "Discover"
    optional: true
