appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      location: never
- tapOn:
    point: "50%,22%"
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "http://.*:8081"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
      - tapOn: "Enter URL manually"
      - tapOn:
          point: "50%,34%"
      - inputText: "${METRO_URL}"
      - tapOn: "Connect"
- runFlow:
    when:
      visible: "Developer Launcher"
    commands:
      - tapOn:
          id: "dev-button-user"
      - extendedWaitUntil:
          visible: "Home"
          timeout: 30000
      - assertVisible: "Home"
- runFlow:
    when:
      visible: "Home"
    commands:
      - assertVisible: "Home"
