appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- tapOn:
    text: "Hungry, http://.*:8081"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
      - tapOn: "Enter URL manually"
      - tapOn:
          point: "50%,34%"
      - inputText: "${METRO_URL}"
      - tapOn: "Connect"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 60000
- tapOn: "Continue"
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible: "Developer Launcher"
    timeout: 60000
- tapOn:
    id: "dev-section-toggle-post-composer-v2-settings"
- tapOn:
    id: "dev-button-launch-v2-composer"
- assertVisible:
    id: "post-composer-screen"
- assertVisible: "New post"
- assertVisible:
    id: "post-composer-add-media"
- tapOn:
    id: "post-composer-add-media"
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "Don’t Allow"
    optional: true
- tapOn:
    text: "Don't Allow"
    optional: true
- assertVisible: "Permission Required"
- tapOn: "OK"
