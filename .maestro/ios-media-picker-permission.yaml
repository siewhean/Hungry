appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      photos: deny
      camera: deny
      microphone: deny
- tapOn:
    point: "50%,22%"
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "http://.*:8081"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
          - tapOn: "Enter URL manually"
          - tapOn:
              point: "50%,34%"
          - inputText: "${METRO_URL}"
          - tapOn: "Connect"
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- runFlow:
    when:
      visible: "Developer Launcher"
    commands:
      - extendedWaitUntil:
          visible: "Continue|Developer Launcher"
          timeout: 60000
      - tapOn:
          id: "dev-section-toggle-post-composer-v2-settings"
      - tapOn:
          id: "dev-button-launch-v2-composer"
      - assertVisible:
          id: "post-composer-screen"
      - assertVisible:
          text: "New post"
      - assertVisible:
          id: "post-composer-add-media"
- runFlow:
    when:
      visible: "Home"
    commands:
      - tapOn:
          text: "Discover"
          optional: true
- runFlow:
    when:
      visible: "post-composer-add-media"
    commands:
      - tapOn:
          id: "post-composer-add-media"
      - tapOn:
          text: "Allow"
          optional: true
      - tapOn:
          text: "Don’t Allow"
          optional: true
      - tapOn:
          text: "Don't Allow"
          optional: true
- runFlow:
    when:
      visible: "Permission Required"
    commands:
      - assertVisible: "Permission Required"
      - tapOn: "OK"
