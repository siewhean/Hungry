appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn:
    point: "50%,22%"
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "http://.*:8081"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
          - tapOn: "Enter URL manually"
          - tapOn:
              point: "50%,34%"
          - inputText: "${METRO_URL}"
          - tapOn: "Connect"
- runFlow:
    when:
      visible: "Developer Launcher"
    commands:
      - tapOn:
          id: "dev-button-review"
          optional: true
      - assertVisible:
          text: "Review"
          optional: true
      - back:
          optional: true
      - tapOn:
          id: "dev-section-toggle-post-composer-v2-settings"
          optional: true
      - tapOn:
          id: "dev-button-launch-v2-composer"
          optional: true
      - assertVisible:
          id: "post-composer-screen"
          optional: true
- runFlow:
    when:
      visible: "Review"
    commands:
      - assertVisible:
          text: "Review"
