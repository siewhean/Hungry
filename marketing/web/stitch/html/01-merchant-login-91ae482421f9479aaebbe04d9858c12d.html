<body class="min-h-screen flex flex-col antialiased">
<!-- TopNavBar (Nav Shell Suppressed due to Transactional Page Intent, but Logo needed) -->
<header class="w-full py-6 px-screen-edge flex justify-center sticky top-0 z-50">
<div class="font-h1 text-h1 text-hungry-orange tracking-tight">Hungry</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-screen-edge py-region-gap">
<div class="w-full max-w-[400px] bg-surface-white rounded-xl border border-line-border p-region-gap flex flex-col gap-region-gap relative z-10">
<!-- Header Area -->
<div class="text-center flex flex-col gap-sm">
<h1 class="font-display text-display text-text-primary">Merchant Portal Login</h1>
<p class="font-body text-body text-text-muted">Manage your hawker stall or restaurant.</p>
</div>
<!-- Form Area -->
<form action="#" class="flex flex-col gap-section-gap" method="POST">
<!-- Inputs Group -->
<div class="flex flex-col gap-lg">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm text-text-secondary font-medium px-1" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-muted" data-icon="mail">mail</span>
</div>
<input class="w-full h-[48px] pl-10 pr-4 rounded-[18px] border border-line-border bg-surface-white font-body text-body text-text-primary focus:outline-none focus:ring-2 focus:ring-hungry-orange focus:border-transparent placeholder-text-muted transition-colors" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center px-1">
<label class="font-body-sm text-body-sm text-text-secondary font-medium" for="password">Password</label>
<a class="font-micro text-micro text-hungry-orange hover:opacity-80 transition-opacity" href="#">Forgot?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-muted" data-icon="lock">lock</span>
</div>
<input class="w-full h-[48px] pl-10 pr-4 rounded-[18px] border border-line-border bg-surface-white font-body text-body text-text-primary focus:outline-none focus:ring-2 focus:ring-hungry-orange focus:border-transparent placeholder-text-muted transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
<!-- Actions Group -->
<div class="flex flex-col gap-md pt-sm">
<button class="w-full h-[52px] bg-hungry-orange text-surface-white font-h3 text-h3 rounded-[18px] flex items-center justify-center gap-sm hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-hungry-orange" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="text-center mt-sm">
<span class="font-body-sm text-body-sm text-text-secondary">Don't have an account? </span>
<a class="font-body-sm text-body-sm text-hungry-orange font-medium hover:underline transition-all" href="#">Register Interest</a>
</div>
</div>
</form>
</div>
