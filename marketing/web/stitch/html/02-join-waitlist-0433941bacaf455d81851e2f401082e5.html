<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hungry - Join Waitlist</title>

        tailwind.config = {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-paper-warm text-on-background min-h-screen flex flex-col font-body">
<!-- TopNavBar (Suppressed for transactional waitlist intent, replacing with a simple minimal header) -->
<header class="w-full py-lg px-screen-edge flex justify-center items-center">
<a class="text-hungry-orange font-h1 text-h1 tracking-tight" href="/">Hungry</a>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-screen-edge w-full">
<div class="w-full max-w-md bg-surface-white rounded-xl border border-line-border p-xxl shadow-sm relative overflow-hidden">
<!-- Decorative accent -->
<div class="absolute top-0 left-0 right-0 h-2 bg-hungry-orange"></div>
<div class="text-center mb-xl">
<h1 class="font-h1 text-h1 text-text-primary mb-sm">Join the Waitlist</h1>
<p class="font-body text-body text-text-secondary">Be the first to experience Singapore's newest local makan guide.</p>
</div>
<form class="space-y-lg">
<!-- User Type Selection (Chips/Radio) -->
<div>
<label class="block font-h3 text-h3 text-text-primary mb-md">I am a...</label>
<div class="grid grid-cols-3 gap-sm">
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="user_type" type="radio" value="foodie"/>
<div class="h-[52px] rounded-lg border border-line-border flex flex-col items-center justify-center gap-xs peer-checked:border-hungry-orange peer-checked:bg-surface-container-low peer-checked:text-hungry-orange transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="restaurant">restaurant</span>
<span class="font-micro text-micro">Foodie</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="user_type" type="radio" value="merchant"/>
<div class="h-[52px] rounded-lg border border-line-border flex flex-col items-center justify-center gap-xs peer-checked:border-hungry-orange peer-checked:bg-surface-container-low peer-checked:text-hungry-orange transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="storefront">storefront</span>
<span class="font-micro text-micro">Merchant</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="user_type" type="radio" value="both"/>
<div class="h-[52px] rounded-lg border border-line-border flex flex-col items-center justify-center gap-xs peer-checked:border-hungry-orange peer-checked:bg-surface-container-low peer-checked:text-hungry-orange transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="handshake">handshake</span>
<span class="font-micro text-micro">Both</span>
</div>
</label>
</div>
</div>
<!-- Name Input -->
<div>
<label class="block font-body-sm text-body-sm text-text-secondary mb-xs" for="name">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-muted" data-icon="person">person</span>
</div>
<input class="block w-full h-[48px] pl-10 pr-md border-line-border rounded-lg bg-surface-white font-body text-body text-text-primary focus:ring-hungry-orange focus:border-hungry-orange placeholder-text-muted transition-colors" id="name" name="name" placeholder="Ah Beng" type="text"/>
</div>
</div>
<!-- Email Input -->
<div>
<label class="block font-body-sm text-body-sm text-text-secondary mb-xs" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-muted" data-icon="mail">mail</span>
</div>
<input class="block w-full h-[48px] pl-10 pr-md border-line-border rounded-lg bg-surface-white font-body text-body text-text-primary focus:ring-hungry-orange focus:border-hungry-orange placeholder-text-muted transition-colors" id="email" name="email" placeholder="makan@shiok.sg" type="email"/>
</div>
</div>
<!-- Postal Code (Optional, adds local flavor) -->
<div>
<label class="block font-body-sm text-body-sm text-text-secondary mb-xs" for="postal">Postal Code <span class="text-text-muted font-micro text-micro">(Optional)</span></label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-muted" data-icon="location_on">location_on</span>
</div>
<input class="block w-full h-[48px] pl-10 pr-md border-line-border rounded-lg bg-surface-white font-body text-body text-text-primary focus:ring-hungry-orange focus:border-hungry-orange placeholder-text-muted transition-colors" id="postal" name="postal" placeholder="e.g. 520111" type="text"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full h-[52px] bg-hungry-orange hover:bg-surface-tint text-surface-white font-h3 text-h3 rounded-[18px] flex items-center justify-center gap-sm transition-colors shadow-sm" type="submit">
<span>Get Early Access</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<p class="font-micro text-micro text-text-muted text-center pt-md">
                    By joining, you agree to our <a class="text-hungry-orange hover:underline" href="#">Terms of Service</a> and <a class="text-hungry-orange hover:underline" href="#">Privacy Policy</a>.
                </p>
</form>
</div>
</main>
<!-- Footer (Minimal for transactional page) -->
<footer class="w-full py-xl text-center border-t border-line-border mt-auto">
<p class="font-micro text-micro text-text-muted">© 2024 Hungry Singapore. Your trusted guide to the local makan scene.</p>
</footer>
</body></html>
