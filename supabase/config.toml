# Local stack name only. The cloud project is chosen by `supabase link --project-ref <ref>`.
project_id = "hungry"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
site_url = "hungry://auth/confirm"
# App deep links for email confirm, password reset and OAuth. auth/callback is the pre-split path kept for old emails.
additional_redirect_urls = [
  "hungry://auth/confirm",
  "hungry://auth/email-change",
  "hungry://auth/reset",
  "hungry://auth/oauth",
  "hungry://auth/callback",
  # Website. The Vercel preview wildcards (hungry-*-...) are gone: production sign-in
  # must not redirect to a preview deployment (medium-low decision 2).
  "https://hungry-siewheans-projects.vercel.app/",
  "https://hungry-siewheans-projects.vercel.app/**",
]
# Matches MIN_PASSWORD_LENGTH in src/features/auth/validation.ts. Leaked-password
# (HIBP) protection has no config.toml key; it is a dashboard setting.
minimum_password_length = 10
password_requirements = ""

# Limits on the Auth endpoints (sign-up, sign-in, OTP / code verify, refresh, email sending).
# email_sent is per hour for the whole project; the others are per 5 minutes per IP address.
# Pinned like [auth.email] so `supabase config push` cannot reset them. Compare with Dashboard >
# Authentication > Rate Limits before pushing config.
[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150
anonymous_users = 30

# Pinned so `supabase config push` cannot reset them to CLI defaults.
[auth.email]
enable_confirmations = true
otp_length = 8
otp_expiry = 3600
max_frequency = "60s"
# Changing the password needs a recent sign-in (changePassword re-signs in first).
secure_password_change = true
# An email change is confirmed from both the old and the new address.
double_confirm_changes = true

# The app asks for the emailed code ({{ .Token }}) on these screens:
# confirmation (EmailVerificationScreen), recovery (ForgotPasswordScreen) and
# magic_link (account deletion, AccountDeletionCodeDialog).
[auth.email.template.confirmation]
subject = "Your Hungry code: confirm your email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Your Hungry code: reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Hungry code: confirm account deletion"
content_path = "./supabase/templates/magic_link.html"

# Production sends auth email through the Send Email Hook (send-email Edge
# Function on Resend, mail.usehungry.com), set in the dashboard. That hook must
# include the code (email_data.token) for the three templates above.

# Off until merchant two-factor sign-in has a screen (medium-low decision 4); the app
# never checks the MFA level, so enrolling would only add an unused factor.
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

# Bot protection for sign-up, password sign-in and reset (auth-L13). Not enabled: it needs
# a Cloudflare Turnstile (or hCaptcha) site key in the app and the secret in the Supabase
# dashboard first, otherwise every sign-up would be rejected. To turn it on:
#   [auth.captcha]
#   enabled = true
#   provider = "turnstile"
#   secret = "env(AUTH_CAPTCHA_SECRET)"

[functions.guest-sessions]
verify_jwt = false

[functions.process-account-deletions]
verify_jwt = false

[functions.purge-orphan-media]
verify_jwt = false

[functions.send-email]
verify_jwt = false

[functions.send-notifications]
verify_jwt = false

[functions.tag-dishes]
verify_jwt = false
