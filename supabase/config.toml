# Local stack name only. The cloud project is chosen by `supabase link --project-ref <ref>`.
project_id = "hungry"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
site_url = "hungry://auth/confirm"
# App deep links for email confirm, password reset and OAuth. auth/callback is the pre-split path kept for old emails.
additional_redirect_urls = [
  "hungry://auth/confirm",
  "hungry://auth/reset",
  "hungry://auth/oauth",
  "hungry://auth/callback",
]

# Pinned so `supabase config push` cannot reset them to CLI defaults.
[auth.email]
enable_confirmations = true
otp_length = 8
max_frequency = "60s"

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[functions.guest-sessions]
verify_jwt = false

[functions.process-account-deletions]
verify_jwt = false

[functions.send-notifications]
verify_jwt = false

[functions.send-email]
verify_jwt = false

[functions.tag-dishes]
verify_jwt = false
